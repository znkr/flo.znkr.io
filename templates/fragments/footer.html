<footer class="site-footer">
    <nav class="footer-links" aria-label="Footer">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/feed.atom">Feed</a>
        {{- if .Meta.Source }}
        <a href="https://github.com/znkr/flo.znkr.io/blob/main/{{ .Meta.Source }}">Source</a>
        {{- else }}
        <a href="https://github.com/znkr/flo.znkr.io">Source</a>
        {{- end }}
    </nav>
    <p class="footer-statement"><a href="/ai/">Written by hand</a></p>
    <span class="footer-author">&copy; Florian Zenker</span>
    <nav class="footer-profiles" aria-label="Profiles">
        {{- range .Profiles }}
        <a class="profile profile-{{ .Icon }}" href="{{ .URL }}" rel="me" title="{{ .Name }}" aria-label="{{ .Name }}"></a>
        {{- end }}
    </nav>
</footer>
